map $http_x_forwarded_proto $original_scheme {
    default $scheme;
    https https;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location = / {
        # Preserve old embedded-flight and room-invitation URLs.
        if ($arg_embed = joyflock) { rewrite ^ /index.html last; }
        if ($arg_game = flight) { rewrite ^ /portal/native-flight.html last; }
        if ($arg_game ~ ^(pool|four|gomoku|chess|xo|cards|snooker|bubbles)$) { rewrite ^ /portal/native-table.html last; }
        if ($arg_room != "") { rewrite ^ /index.html last; }
        rewrite ^ /portal/index.html last;
    }
    location = /portal/index.html {
        add_header Cache-Control "no-cache";
        if ($arg_game = flight) { rewrite ^ /portal/native-flight.html last; }
        if ($arg_game ~ ^(pool|four|gomoku|chess|xo|cards|snooker|bubbles)$) { rewrite ^ /portal/native-table.html last; }
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
    location /api/ {
        client_max_body_size 3m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $original_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $original_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
    }
}
