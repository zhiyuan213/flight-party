map $http_x_forwarded_proto $original_scheme {
    default $scheme;
    https https;
}
# Every shipped asset URL carries a frozen ?v= (plus &d/&r/... cache keys).
# Unversioned entries (HTML documents, /api/) must stay revalidated; versioned
# assets can be reused for a day without a conditional GET. On a high-latency
# link that removes dozens of 304 round trips from every detail-page visit.
# Any file edited in place MUST get a new ?v= before release.
map "$uri:$args" $joyflock_static_cache {
    default "no-cache";
    # An HTML document is always revalidated, even if a ?v= was appended.
    ~\.html(?::|$) "no-cache";
    ~(?:^|:|&)v=   "public, max-age=86400";
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location = / {
        # Preserve old embedded-flight and room-invitation URLs.
        if ($arg_embed = joyflock) { rewrite ^ /index.html last; }
        if ($arg_game = flight) { rewrite ^ /portal/native-flight.html last; }
        if ($arg_game ~ ^(pool|nineball|four|gomoku|chess|xo|cards|snooker|bubbles)$) { rewrite ^ /portal/native-table.html last; }
        if ($arg_room != "") { rewrite ^ /index.html last; }
        rewrite ^ /portal/index.html last;
    }
    location = /portal/index.html {
        add_header Cache-Control "no-cache";
        if ($arg_game = flight) { rewrite ^ /portal/native-flight.html last; }
        if ($arg_game ~ ^(pool|nineball|four|gomoku|chess|xo|cards|snooker|bubbles)$) { rewrite ^ /portal/native-table.html last; }
    }
    location / {
        add_header Cache-Control $joyflock_static_cache;
        try_files $uri $uri/ =404;
    }
    # Production-only rule installed with the native game pages. Keep it: pool
    # and table assets are edited in place more often and stay revalidated.
    location ~ ^/(table/|assets/(pool/|audio/pool/)) {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
    location /api/ {
        client_max_body_size 3m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $original_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $original_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
    }
}
