services:
  edge:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
  web:
    restart: unless-stopped
  backend:
    restart: unless-stopped
    environment:
      FLIGHTPARTY_SECURE_COOKIE: 'true'
      SERVER_FORWARD_HEADERS_STRATEGY: native
      JAVA_TOOL_OPTIONS: '-Xms128m -Xmx768m'
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${FLIGHTPARTY_DB_PASSWORD:?Set a unique production database password}
  redis:
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
