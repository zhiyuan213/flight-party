services:
  redis:
    image: redis:8.2.3
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 20
    networks: [qa]
  tests:
    build:
      context: ../backend
      target: integration
    command: ["-Dtest=CommandCommitterIntegrationTest", "test"]
    environment:
      REDIS_TEST_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    networks: [qa]
networks:
  qa:
    internal: true
