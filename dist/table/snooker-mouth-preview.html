<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>斯诺克袋口</title><style>body{margin:20px;background:#101827;color:#eee;font:14px system-ui}h1{font-size:20px}h2{font-size:16px;margin-top:24px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:1080px}.frames{grid-template-columns:repeat(4,minmax(0,1fr))}figure{margin:0}canvas{width:100%;background:#101827;border-radius:8px}figcaption{margin:6px 0;color:#b8c7d8}@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style><h1>斯诺克：袋口放大</h1><p>正式球台绘制函数；下方为固定时刻落袋动画检查，不是整局录像。</p><div id="mouths" class="grid"></div><h2>中间落球</h2><div id="middle" class="grid frames"></div><h2>角落落球</h2><div id="corner" class="grid frames"></div><h2>台呢顶灯 · 台呢与球体光照</h2><canvas id="lighting" width="2288" height="1288" style="max-width:1080px"></canvas><p id="checks"></p><p id="errors"></p><script type="module">
import {makeSnookerTable,snookerCloth,SNOOKER_CUSHION_WIDTH} from './snooker-table.js?v=20261114-pocketdepth1';
import {snookerPockets,SNOOKER_POCKET_SCALE} from './pool-geometry.js?v=20261114-pocketdepth1&power=20261120-poolpower30';
import {TABLE_PAD,TABLE_WIDTH,TABLE_HEIGHT} from './pool-table.js';
import {drawSnookerPocketDrops,snookerPocketPosition} from './snooker-pocket-motion.js?v=20261113-wellmotion1&release=20261115-polishrelease1';
import {SNOOKER_LIGHT} from './snooker-light.js?v=20261113-reboundlight1';
import {drawPoolBall} from './pool-ball.js?v=20261112-gamelanes1';
window.addEventListener('error',e=>document.querySelector('#errors').textContent=e.message);
const sheet=document.createElement('canvas');sheet.width=TABLE_WIDTH*2;sheet.height=TABLE_HEIGHT*2;const b=sheet.getContext('2d');b.scale(2,2);makeSnookerTable(b);
const holes=snookerPockets(SNOOKER_POCKET_SCALE);
function tile(parent,index,age){const p=holes[index],f=document.createElement('figure'),c=document.createElement('canvas'),label=document.createElement('figcaption');c.width=480;c.height=340;const ctx=c.getContext('2d'),zoom=4;ctx.translate(240,145);ctx.scale(zoom,zoom);ctx.translate(-TABLE_PAD-p.x,-TABLE_PAD-p.y);ctx.drawImage(sheet,0,0,TABLE_WIDTH,TABLE_HEIGHT);
if(age!==undefined){const mid=p.middle,item={id:1,x:TABLE_PAD+(mid?500:0),y:TABLE_PAD,start:0,vx:mid?0:-12,vy:-12,holeIndex:mid?1:0,rattle:false,rebound:false};drawSnookerPocketDrops(ctx,[item],age,8,(ctx,id,x,y,r,a,h,o)=>drawPoolBall(ctx,id,x,y,r,a,h,o,{...SNOOKER_LIGHT,x:TABLE_PAD+500,y:TABLE_PAD+250},{plain:true,overhead:true,palette:["#fff","#d94137"]}));label.textContent=age+' ms · 深度 '+snookerPocketPosition(item,age).depth.toFixed(2);}else label.textContent=['左上角袋口','上中袋','右上角袋口','左下角袋口','下中袋','右下角袋口'][index];f.append(c,label);document.querySelector(parent).append(f);}
for(let i=0;i<6;i++)tile('#mouths',i);for(const age of [0,80,160,400]){tile('#middle',1,age);tile('#corner',0,age);}
const raw=snookerCloth(),reference=document.createElement('canvas');reference.width=sheet.width;reference.height=sheet.height;const rc=reference.getContext('2d');rc.scale(2,2);rc.translate(TABLE_PAD,TABLE_PAD);rc.drawImage(raw,-20,-20,1040,540);
const actual=b.getImageData(0,0,sheet.width,sheet.height).data,expected=rc.getImageData(0,0,sheet.width,sheet.height).data;
let diff=0,samples=0;for(const p of holes){const ux=p.middle?0:(p.x<500?1:-1)*Math.SQRT1_2,uy=(p.y<250?1:-1)*(p.middle?1:Math.SQRT1_2);for(let d=p.r+3;d<=p.r+28;d++)for(let w=-3;w<=3;w++){const x=Math.round(2*(TABLE_PAD+p.x+ux*d-uy*w)),y=Math.round(2*(TABLE_PAD+p.y+uy*d+ux*w)),k=(y*sheet.width+x)*4;for(let i=0;i<3;i++)diff=Math.max(diff,Math.abs(actual[k+i]-expected[k+i]));samples++;}}
const railDrop=[[250,4],[750,4],[4,250],[996,250]].map(([x,y])=>{const k=(Math.round(2*(TABLE_PAD+y))*sheet.width+Math.round(2*(TABLE_PAD+x)))*4;return expected[k+1]-actual[k+1];});
let innerDark=0,innerSamples=0;for(let d=-SNOOKER_CUSHION_WIDTH+3;d<=-3;d++)for(let t=60;t<=440;t+=10)for(const [x,y] of [[t,d],[t,500-d],[d,t],[1000-d,t]]){const k=(Math.round(2*(TABLE_PAD+y))*sheet.width+Math.round(2*(TABLE_PAD+x)))*4;for(let c=0;c<3;c++)innerDark=Math.max(innerDark,expected[k+c]-actual[k+c]);innerSamples++;}
document.querySelector('#checks').textContent='入口台呢对照 '+samples+' 点 · 最大 RGB 差 '+diff+'；绿色内壁 '+innerSamples+' 点最大压暗 '+innerDark+'；直库边侧阴影绿通道下降 '+railDrop.join('/')+'。';
const lightCanvas=document.querySelector('#lighting'),lc=lightCanvas.getContext('2d');lc.scale(2,2);lc.drawImage(sheet,0,0,TABLE_WIDTH,TABLE_HEIGHT);for(const y of [75,250,425])for(const x of [100,500,900])drawPoolBall(lc,1,TABLE_PAD+x,TABLE_PAD+y,8,0,0,null,{...SNOOKER_LIGHT,x:TABLE_PAD+500,y:TABLE_PAD+250},{plain:true,overhead:true,palette:['#fff','#d94137']});
</script></html>
