<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四子连珠 · JoyFlock</title><link rel="stylesheet" href="table.css?v=3"></head><body><header><a href="#" id="home-link">✦ JoyFlock</a><span id="game-name"></span><div><span id="profile">游客</span><button id="account-open">登录 / 注册</button><a href="https://flight.joyflock.com/membership.html" target="_blank" rel="noopener">会员</a></div></header><main><section class="game-panel"><div class="board-top"><span class="eyebrow">A LITTLE FRIENDLY COMPETITION</span><span id="mode">选择玩法</span></div><h1 id="title">四子连珠</h1><p id="status" role="status">连接四颗棋子，赢下你的下一场欢乐。</p><div id="board" class="board" aria-label="棋盘"></div><div id="seats" class="seats"></div><p id="message" role="alert"></p></section><aside><div class="menu"><h2>一起玩一局</h2><p>免费畅玩。会员外观不影响公平对局。</p><button class="primary" id="quick">快速匹配 ↗</button><button id="friends">创建好友房间</button><div class="local-buttons"><button id="computer">单机 · 电脑对战</button><button id="local">单机 · 双人同屏</button></div><form id="join"><label for="room-code">房间码或邀请链接</label><input id="room-code" required placeholder="粘贴好友的邀请"><button>加入房间</button></form><label id="promotion-setting" hidden>兵升变为<select id="promotion"><option value="1">皇后</option><option value="2">车</option><option value="3">象</option><option value="4">马</option></select></label><div id="room-tools" hidden><p id="room-status"></p><button id="ready">准备开始</button><button id="share">邀请好友 · 复制链接</button><button id="leave">退出房间</button></div><button id="again" hidden>再玩一局</button></div><div class="rules"><h3>怎么玩</h3><p id="rules"></p><p>联机每回合30秒。超时由电脑代走；重新打开邀请链接可以恢复原来的席位。</p><p id="score-note">登录账号的联机完整对局自动保存。单机和游客对局不累计。第一名+3分、第二名+2分；平局各+2分，分游戏统计。</p><small id="stats"></small><h3 class="ranking-title">本游戏积分榜</h3><ol id="leaderboard"></ol></div></aside></main><dialog id="auth"><form id="auth-form"><button type="button" id="auth-close" class="close">×</button><h2>你的 JoyFlock 账号</h2><label>昵称（注册时填写）<input name="displayName" maxlength="64" autocomplete="nickname"></label><label>邮箱<input name="email" type="email" required autocomplete="username"></label><label>密码<input name="password" type="password" minlength="8" required autocomplete="current-password"></label><label>确认密码（注册时填写）<input name="confirmation" type="password" autocomplete="new-password"></label><p id="auth-error" role="alert"></p><div class="local-buttons"><button name="action" value="login" class="primary">登录</button><button name="action" value="register">注册</button></div></form></dialog><script type="module" src="table.js?v=3"></script></body></html>
