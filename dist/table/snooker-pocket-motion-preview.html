<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>斯诺克：洞内旋转与反弹</title>
<style>body{margin:20px;background:#101827;color:#e9eff6;font:14px system-ui}h1{margin:0 0 8px;font-size:21px}p{margin:8px 0;color:#b7c7d7}.controls{display:flex;gap:8px;align-items:center;margin:12px 0}button,select{font:inherit;color:#ecf3fa;border:1px solid #52657a;background:#23344b;padding:7px 14px;border-radius:6px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:1050px}figure{margin:0;background:#17253a;border-radius:8px;overflow:hidden}canvas{display:block;width:100%;aspect-ratio:350/205}figcaption{padding:8px 10px;font-size:13px}.phase{float:right;color:#acbed0}#checks{max-width:1050px;font-size:12px}@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style>
<h1>斯诺克：先进入黑洞，再旋转与反弹</h1><p>上排擦边入洞，下排正面入洞；浅色细线仅用于核对轨迹。</p>
<div class="controls"><select id="hole" aria-label="袋口"><option value="1">上中袋</option><option value="0">左上角袋口</option><option value="2">右上角袋口</option><option value="3">左下角袋口</option><option value="4">下中袋</option><option value="5">右下角袋口</option></select><button id="replay">重播</button><button id="freeze">洞内关键帧</button></div>
<div class="grid" id="cards"></div><p id="checks"></p><p id="errors"></p>
<script type="module">
import {TABLE_PAD,TABLE_WIDTH,TABLE_HEIGHT} from './pool-table.js';
import {makeSnookerTable} from './snooker-table.js?v=20261114-pocketdepth1';
import {snookerPockets,SNOOKER_POCKET_SCALE} from './pool-geometry.js?v=20261114-pocketdepth1';
import {snookerPocketMotion,snookerPocketPosition,drawSnookerPocketDrops} from './snooker-pocket-motion.js?v=20261113-wellmotion1';
import {drawPoolBall} from './pool-ball.js?v=20261113-pocketdepth1';
import {SNOOKER_LIGHT} from './snooker-light.js?v=20261113-reboundlight1';
window.addEventListener('error',e=>document.querySelector('#errors').textContent=e.message);
const params=new URLSearchParams(location.search),sheet=document.createElement('canvas');sheet.width=TABLE_WIDTH*2;sheet.height=TABLE_HEIGHT*2;
const tc=sheet.getContext('2d');tc.scale(2,2);makeSnookerTable(tc);
let selected=Number(params.get('hole')??1),started=performance.now(),fixed=params.has('t')?Number(params.get('t')):null,freeze=params.has('frame'),cards=[];
const holeSelect=document.querySelector('#hole');holeSelect.value=selected;
const paintBall=(ctx,id,x,y,r,a,h,o)=>drawPoolBall(ctx,1,x,y,r,a,h,o,{...SNOOKER_LIGHT,x:SNOOKER_LIGHT.x+TABLE_PAD,y:SNOOKER_LIGHT.y+TABLE_PAD},{plain:true,overhead:true,palette:['#fff8e6','#e34235']});
function entry(index,speed,glancing){const well=snookerPockets(SNOOKER_POCKET_SCALE)[index],radial=well.middle?[0,well.y<250?1:-1]:[well.x<500?Math.SQRT1_2:-Math.SQRT1_2,well.y<250?Math.SQRT1_2:-Math.SQRT1_2];let vx=-radial[0]-(glancing?radial[1]*.7:0),vy=-radial[1]+(glancing?radial[0]*.7:0),d=Math.hypot(vx,vy);return {id:7,holeIndex:index,x:TABLE_PAD+well.x+radial[0]*(well.r+6),y:TABLE_PAD+well.y+radial[1]*(well.r+6),vx:vx/d*speed,vy:vy/d*speed,start:0};}
function build(){document.querySelector('#cards').replaceChildren();cards=[];for(const glancing of [true,false])for(const [speed,name] of [[4,'轻'],[26,'中'],[48,'重']]){const item=entry(selected,speed,glancing),motion=snookerPocketMotion(item),figure=document.createElement('figure'),canvas=document.createElement('canvas'),caption=document.createElement('figcaption'),phase=document.createElement('span');canvas.width=700;canvas.height=410;phase.className='phase';caption.append((glancing?'擦边':'正面')+' · '+name+'力度 · '+(glancing?motion.turns.toFixed(2)+' 圈':motion.bounces+' 次反弹'),phase);figure.append(canvas,caption);document.querySelector('#cards').append(figure);cards.push({item,motion,canvas,phase});}}
function draw(now){const age=fixed??((now-started)%1150);for(const {item,motion:m,canvas,phase} of cards){const time=freeze?m.leadEnd+(m.dropAt-m.leadEnd)*.38:age,ctx=canvas.getContext('2d');ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.translate(350,180);ctx.scale(5,5);ctx.translate(-m.center[0],-m.center[1]);ctx.drawImage(sheet,0,0,TABLE_WIDTH,TABLE_HEIGHT);if(params.get('trace')!=='0'){ctx.strokeStyle='#f4ead28c';ctx.lineWidth=.35;ctx.setLineDash([.9,1.1]);ctx.beginPath();for(const p of m.samples){if(p.time>m.dropAt)break;if(p.time===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);}ctx.stroke();ctx.setLineDash([]);}drawSnookerPocketDrops(ctx,[item],time,8,paintBall);const p=snookerPocketPosition(item,time);phase.textContent=Math.round(time)+' ms · '+({approach:'入洞',orbit:'洞内旋转',rebound:'洞内反弹',sink:'下沉'}[p.phase]);}requestAnimationFrame(draw);}
let outside=0,samples=0;for(let i=0;i<6;i++)for(const glancing of [false,true])for(const speed of [4,26,48]){const item=entry(i,speed,glancing),m=snookerPocketMotion(item);for(let t=m.leadEnd;t<650;t++){const p=snookerPocketPosition(item,t);samples++;if(Math.hypot(p.x-m.center[0],p.y-m.center[1])+8*p.radiusScale>m.well.r+.0001)outside++;}}
document.querySelector('#checks').textContent='六个袋口 × 两个方向 × 三种力度 '+samples+' 次采样：完整球体越过黑洞边缘 '+outside+' 次。仅验证表现，进球判定及计分保持原样。';
holeSelect.addEventListener('change',()=>{selected=Number(holeSelect.value);build();started=performance.now();});document.querySelector('#replay').addEventListener('click',()=>{fixed=null;freeze=false;started=performance.now();});document.querySelector('#freeze').addEventListener('click',()=>{fixed=null;freeze=true;});
build();requestAnimationFrame(draw);
</script></html>
