<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <header hidden><button id="back" type="button" aria-label="Back">←</button><span id="game-title"></span><output id="status" aria-live="polite"></output></header>

    <canvas tabindex="0" hidden></canvas>

      <div>
        <p id="kicker"></p>
        <h1 id="intro-title"></h1>

      </div>
    </section>
  </main>
  <footer hidden><label id="nomination-label" hidden><span></span><select id="nomination"></select></label><label id="power-label" hidden><span></span><input id="power" type="range" min="5" max="100" value="55"></label><button id="action" type="button" hidden></button></footer>
  <dialog><h2></h2><button id="again" type="button"></button></dialog>
  <script type="module" src="./arcade.js?v=20261109-result1"></script>
<script defer src="/site-hover-sfx.js?v=20261109-zoom1"></script><script defer src="/site-result-sfx.js?v=20261109-result1"></script><script defer src="/site-pointer-relay.js?v=20261109-ambfull1"></script><script defer src="/site-context-menu.js?v=20261109-noselect1"></script></body>
