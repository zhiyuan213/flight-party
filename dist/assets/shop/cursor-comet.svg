<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" data-cursor-tier="legend"><style>
.badge-motion{transform-box:fill-box;transform-origin:center;animation:badge-orbit 4s linear infinite}
.badge-motion{transform-box:view-box;transform-origin:26px 7px}
.arrow-shift{animation:arrow-colour 5s ease-in-out infinite}.arrow-glint{animation:arrow-glint 4.8s ease-in-out infinite}.badge-spark{animation:spark 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes badge-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
@keyframes badge-turn{to{transform:rotate(360deg)}}
@keyframes badge-gem{0%,100%{transform:rotate(-8deg) scale(.95)}50%{transform:rotate(8deg) scale(1.05)}}
@keyframes badge-orbit{to{transform:rotate(360deg)}}
@keyframes badge-beat{0%,100%{transform:scale(1)}14%{transform:scale(1.15)}28%{transform:scale(1)}40%{transform:scale(1.08)}}
@keyframes badge-flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.72)}}
@keyframes badge-nova{0%,100%{transform:rotate(0) scale(.82)}50%{transform:rotate(22deg) scale(1.12)}}
@keyframes arrow-colour{0%,100%{stop-color:#aee9ec}50%{stop-color:#dffcfd}}
@keyframes arrow-glint{0%,15%{transform:translate(-22px,0);opacity:0}25%{opacity:.95}62%{transform:translate(22px,0);opacity:0}100%{transform:translate(22px,0);opacity:0}}
@keyframes spark{0%,100%{opacity:.45;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.arrow-glint{display:none}}
</style><defs><linearGradient id="arrowGradient" x1="0" y1="0" x2="1" y2="1"><stop class="arrow-shift" offset="0" stop-color="#aee9ec"/><stop offset="1" stop-color="#71cdd1"/></linearGradient><clipPath id="arrowClip"><path d="M3 2 L3 24 L9.3 18.6 L13.4 28.2 L17.6 26.4 L13.6 17.4 L22.2 17.5 Z" fill="#fff" /></clipPath></defs><path d="M3 2 L3 24 L9.3 18.6 L13.4 28.2 L17.6 26.4 L13.6 17.4 L22.2 17.5 Z" fill="url(#arrowGradient)" stroke="#17283e" stroke-width="1.35" stroke-linejoin="round" class="cursor-arrow" data-base-fill="#71cdd1"/><g clip-path="url(#arrowClip)" data-raster="skip"><path class="arrow-glint" d="M0 0 L4 0 L17 32 L13 32 Z" fill="#f5edff" opacity="0"/></g><g class="cursor-badge" transform="translate(0 17)"><circle cx="26" cy="7" r="3.4" fill="#559eae" stroke="#193246" stroke-width="1.1"/><circle cx="25.1" cy="6" r="1" fill="#b5f5e3"/><g class="badge-motion"><ellipse cx="26" cy="7" rx="4.5" ry="2.4" fill="none" stroke="#f4dfa6" stroke-width="1.1"/><circle cx="30.4" cy="7" r="1.05" fill="#fff1b7" stroke="#39556b" stroke-width=".65"/></g></g></svg>
