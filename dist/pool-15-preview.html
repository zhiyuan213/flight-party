<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>台球 15 球验收场景</title><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20261109-icon1"><link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20261109-icon1">
<link rel="stylesheet" href="/table/pool-shell.css"><style>[hidden]{display:none!important}body{background:#080e18;color:#dce9fa;font:16px system-ui;margin:20px}button{padding:8px;margin:4px}#board{display:grid;grid-template-columns:64px 1fr;gap:10px;max-width:1500px}.pool-table-canvas{width:100%}.pool-note{grid-column:2}.pool-table-wrap{width:100%}.targets{display:flex;gap:24px}.targets canvas{width:32px;height:32px}#gallery{display:flex;flex-wrap:wrap}#gallery img{width:90px;height:90px}.pool-left-controls{height:600px}</style>
<h1>15 球本地验证 · 固定场景</h1><p>使用正式规则、球体和回放组件。场景仅用于本地验证，不提交联网成绩。</p>
<button id="solid">全色落袋场景</button><button id="stripe">花色落袋场景</button><button id="shoot">执行80%击球</button><button id="rack">重新开局</button>
<button id="export">导出16张球体图片</button><p id="result"></p><div class="targets"><div id="one"></div><div id="two"></div></div><div id="board"></div><h2>独立球体预览（白球与1–15号）</h2><div id="gallery"></div>
<script type="module">
import {poolStart,poolMove,renderPool} from '/table/pool.js?release=20261115-polishrelease1';import {poolTargets} from '/table/pool-rules.js';import {drawPoolBall} from '/table/pool-ball.js?v=20261112-gamelanes1';
let state;const host=document.querySelector('#board');
function targetRow(id,seat){const div=document.querySelector(id),g=state.cells[49+seat];div.replaceChildren();div.append(document.createTextNode('玩家'+seat+'：'+['待分组','全色','花色'][g]));if(g)for(const n of poolTargets(state.cells,seat)){const c=document.createElement('canvas');c.width=c.height=96;drawPoolBall(c.getContext('2d'),n,48,46,36);div.append(c);}}
function render(){renderPool(host,state,true);targetRow('#one',1);targetRow('#two',2);document.querySelector('#result').textContent=state.fen+' · 玩家'+state.turn+'回合';}
function reset(id){host._animationToken=(host._animationToken||0)+1;host._animating=false;host._snapshot=null;host._painted=null;host._lastMove=0;host._returns=[];host._orientation=null;host._queued=null;state=poolStart();if(id){state.cells[0]=1500;state.cells[1]=1500;state.cells[id*3]=400;state.cells[id*3+1]=400;}render();}
document.querySelector('#solid').onclick=()=>reset(1);document.querySelector('#stripe').onclick=()=>reset(9);document.querySelector('#rack').onclick=()=>reset();document.querySelector('#shoot').onclick=()=>{if(host._animating)return;state=poolMove(state,state.turn,80*3600+2250);render();};host.addEventListener('click',e=>{const b=e.target.closest('[data-position]');if(b){state=poolMove(state,state.turn,Number(b.dataset.position));render();}});
for(let id=0;id<16;id++){const c=document.createElement('canvas');c.width=c.height=192;c.setAttribute('aria-label',id+'号球');drawPoolBall(c.getContext('2d'),id,96,92,70);const img=document.createElement('img');img.src=c.toDataURL('image/png');img.alt=id+'号球';document.querySelector('#gallery').append(img);}reset(1);
document.querySelector('#export').onclick=()=>{const chunks=[],encoder=new TextEncoder();Array.from(document.querySelectorAll('#gallery img')).forEach((canvas,id)=>{const raw=atob(canvas.src.split(',')[1]),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0)),header=new Uint8Array(512),write=(offset,value)=>header.set(encoder.encode(value),offset);write(0,'ball-'+id+'.png');write(100,'0000644\0');write(108,'0000000\0');write(116,'0000000\0');write(124,bytes.length.toString(8).padStart(11,'0')+'\0');write(136,'00000000000\0');write(148,'        ');write(156,'0');write(257,'ustar\0');write(263,'00');const sum=header.reduce((a,b)=>a+b,0);write(148,sum.toString(8).padStart(6,'0')+'\0 ');chunks.push(header,bytes,new Uint8Array((512-bytes.length%512)%512));});chunks.push(new Uint8Array(1024));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'application/x-tar'}));a.download='pool-balls.tar';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
</script><script defer src="/site-context-menu.js?v=20261110-glove2"></script><script defer src="/site-floating-dots.js?v=20261110-glove2&d=20261115-staticnebula1"></script><script defer src="/site-shooting-star.js?v=20261110-brandonly1"></script></html>
