<h1>开球连锁撞击 · 音效 A/B 试听</h1>
<p><a href="./pool-hit-audition.html" style="color:#8fe4d8;font-weight:700">最新：试听 A / B / C / D 四款单次球碰球声音 →</a></p>
<p>当前使用 A 加厚版，压下尖锐共振、补足中低频主体；多次碰撞叠成一簇：前几下紧密重合，后面逐渐散开。音高与叠加节奏不变。以下使用同一杆真实开球的接触事件，新按钮调用正式多球混音。</p>
