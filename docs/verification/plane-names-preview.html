<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/dist/">
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="visual-v2.css"><link rel="stylesheet" href="visual-v7.css">
<style>body{padding:16px}h1{font-size:22px;margin:0 0 8px}.checks{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.checks button{padding:10px;font-size:12px}#preview-board{position:relative;width:min(900px,100%);height:600px;margin:auto;overflow:hidden;border-radius:18px}#status{font-size:12px}dialog canvas{display:block;width:300px;height:95px;max-width:100%}@media(max-width:700px){#preview-board{height:440px}h1{font-size:18px}body{padding:10px}}</style>
<h1>飞机姓名、新造型及彩虹 · 本地渲染验收</h1><p>模拟四名会员，仅检查实际 CanvasBoard；不授予生产会员，不产生真实成绩。</p>
<div class="checks"><button class="secondary" id="mixed">三款会员飞机</button><button class="secondary" id="same">四人同款金翼</button><button class="secondary" id="stack">叠机排版</button><button class="secondary" id="move">播放跳格移动</button><button class="secondary" id="bump">播放撞机</button><button class="secondary" id="rainbow">查看实际彩虹预览</button><button class="secondary" id="capture">保存验收截图</button></div><p id="status">准备完成</p><div id="preview-board"></div>
<dialog id="rainbow-dialog"><button class="close" id="rainbow-close">×</button><h2>彩虹尾迹 · 与对局共用绘制</h2><section role="tabpanel"><canvas width="300" height="95"></canvas></section></dialog>
<script type="module">
import {CanvasBoard} from './fallback.js';import {Game} from './engine.js';import {startTrailPreview} from './flight-trails.js';
const board=new CanvasBoard(document.getElementById('preview-board'),()=>{}),status=document.getElementById('status');let game,busy=false,styles=['gold2d','cloud2d','night2d','gold2d'];
function setup(kind='parked'){game=new Game(['大卫','云海飞行员','Night Pilot','星星爱好者✨'].map((name,i)=>({name,type:'human',member:true,planeStyle:styles[i],flightTrail:'rainbow'})));if(kind==='move')game.players[0].pieces=[0,-1];if(kind==='bump'){game.players[0].pieces=[41,-1];game.players[3].pieces=[6,-1];}if(kind==='stack')game.players.forEach((p,i)=>p.pieces=[(5-i*13+52)%52,(5-i*13+52)%52]);board.setGame(game);}
setup();document.getElementById('mixed').onclick=()=>{if(busy)return;styles=['gold2d','cloud2d','night2d','gold2d'];setup();status.textContent='三款飞机，八个姓名标签';};document.getElementById('same').onclick=()=>{if(busy)return;styles.fill('gold2d');setup();status.textContent='四名会员均使用金翼，通过玩家姓名区分';};document.getElementById('stack').onclick=()=>{if(!busy){setup('stack');status.textContent='叠机排版压力测试，非游戏规则示例';}};
async function animate(kind){if(busy)return;busy=true;setup(kind);game.roll(kind==='bump'?4:6);const result=game.move(0);status.textContent='实际移动动画播放中';await board.move(result,()=>status.textContent='实际碰撞返回动画');game.advance();board.sync(game);busy=false;status.textContent='动画完成，姓名保持正向';}
document.getElementById('move').onclick=()=>animate('move');document.getElementById('bump').onclick=()=>animate('bump');const dialog=document.getElementById('rainbow-dialog');document.getElementById('rainbow').onclick=()=>{dialog.showModal();startTrailPreview(dialog.querySelector('canvas'),'rainbow',false,true);};document.getElementById('rainbow-close').onclick=()=>dialog.close();document.getElementById('capture').onclick=()=>board.canvas.toBlob(async blob=>{const response=await fetch('/__capture',{method:'POST',body:blob});status.textContent=response.ok?'本地截图已保存':'请使用本地验收服务器保存截图';},'image/png');
</script></html>
