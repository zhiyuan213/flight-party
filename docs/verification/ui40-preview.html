<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/dist/">
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="visual-v2.css"><link rel="stylesheet" href="visual-v7.css">
<style>body{padding:20px}h1{font-size:22px;margin:0 0 10px}.qa-controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.qa-controls button{padding:9px;font-size:12px}.qa-grid{display:grid;grid-template-columns:1fr 542px;gap:30px;max-width:1200px;margin:auto}#preview-board{position:relative;height:640px;overflow:hidden;border-radius:22px}.qa-grid .leaderboard-shell{margin:0}#qa-hero{width:150px;height:140px}.qa-identity{display:flex;align-items:center;gap:24px}.qa-header{display:flex;gap:12px;margin:12px 0}.qa-header h2{font-size:22px}@media(max-width:800px){body{padding:10px}.qa-grid{display:flex;flex-direction:column;gap:16px}#preview-board{height:400px}.qa-header{flex-wrap:wrap}}</style>
<h1>UI40 本地验收 · 模拟资格</h1><p>所有账号与排行均为内存测试数据，不向生产授予会员或记录成绩。</p>
<div class="qa-controls"><button id="zh">中文</button><button id="en">English</button><button id="vip">模拟普通 VIP</button><button id="annual">模拟年 VIP</button><button id="guest">模拟普通账号</button><button id="capture">保存实际棋盘截图</button></div>
<div class="qa-identity"><div id="qa-hero"></div><span>点击飞机检查实际机库、螺旋桨和选择权限</span></div><div class="qa-header"><h2 data-member="true">普通VIP</h2><h2 data-member="true" data-annual-member="true">年会员</h2><h2 data-member="false">普通账号</h2></div><p id="qa-status">准备完成</p>
<div class="qa-grid"><div id="preview-board"></div><section class="leaderboard-shell" id="leaderboard-shell"></section></div>
<script type="module">
import {CanvasBoard} from './fallback.js';import {Game} from './engine.js';import {SocialUI} from './social-ui.js';import {HeroPlane} from './hero-plane.js';import {bindHangar} from './hangar.js';
let language='zh';const t=(en,zh)=>language==='zh'?zh:en;const social=new SocialUI({getLanguage:()=>language});social.leaderboard=document.getElementById('leaderboard-shell');social.liveBoards={};social.liveBoardStatus={};const names=['大卫','Annual Aurora Pilot','Long Name Pilot Golden Wings','Cloud Captain','月光飞行员','Rainbow Traveller','Sky Mango','测试玩家','Pilot Nine','Pilot Ten'];
for(const key of ['month','week','day']){social.liveBoardStatus[key]='loaded';social.liveBoards[key]=names.map((name,i)=>({name,points:128-i*13,games:111-i*8,avatar:i%4,member:i<4,annualMember:i===1,avatarFrame:i===0?'gold':i===1?'night':i===2?'cloud':'none'}));}social.renderLeaderboard();social.leaderboard.onclick=e=>{const b=e.target.closest('[data-leaderboard-tab]');if(b){social.boardTab=b.dataset.leaderboardTab;social.renderLeaderboard();}};
const status=document.getElementById('qa-status'),session=new EventTarget();let appearance={member:true,annualMember:true,plane:'obsidian2d'};session.request=async(path,data)=>{if(data?.plane)appearance={...appearance,plane:data.plane};status.textContent='本地模拟已保存：'+appearance.plane;return {appearance};};let hero=new HeroPlane(document.getElementById('qa-hero'),{style:'obsidian2d'});bindHangar(hero,session,t,()=>false,style=>{hero.dispose();hero=new HeroPlane(document.getElementById('qa-hero'),{style});return hero;});const emit=()=>session.dispatchEvent(new CustomEvent('identity',{detail:{appearance}}));emit();
document.getElementById('vip').onclick=()=>{appearance={member:true,annualMember:false,plane:'gold2d'};emit();status.textContent='普通VIP：三款可使用，年VIP两款只能预览';};document.getElementById('annual').onclick=()=>{appearance={member:true,annualMember:true,plane:'obsidian2d'};emit();status.textContent='年VIP：五款会员飞机可使用';};document.getElementById('guest').onclick=()=>{appearance={member:false,annualMember:false,plane:'classic'};emit();status.textContent='普通账号：经典飞机';};
for(const key of ['zh','en'])document.getElementById(key).onclick=()=>{language=key;document.documentElement.lang=key==='zh'?'zh-CN':'en';social.renderLeaderboard();};
const board=new CanvasBoard(document.getElementById('preview-board'),()=>{});const game=new Game(['黑曜年会员','极光年会员','普通金翼VIP','普通经典玩家'].map((name,i)=>({name,type:'human',member:i<3,annualMember:i<2,planeStyle:['obsidian2d','aurora2d','gold2d','classic'][i]})));board.setGame(game);
document.getElementById('capture').onclick=()=>board.canvas.toBlob(async blob=>{const r=await fetch('/__capture',{method:'POST',body:blob});status.textContent=r.ok?'实际棋盘截图已保存':'未启用本地截图服务';},'image/png');
</script></html>
