<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/dist/"><title>Flight Party · VIP 真实模型验收</title><style>
body{margin:0;background:#edf5ff;color:#203c73;font:16px Arial,sans-serif}main{max-width:1050px;margin:auto;padding:24px}h1{font-size:25px}p{font-size:13px;color:#647d9f}nav{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}button{border:1px solid #adc7ea;border-radius:12px;background:#fff;padding:12px 18px;color:#244e94;cursor:pointer}button[aria-pressed=true]{background:#d9e8ff;border-color:#477eff}.stage{height:520px;background:radial-gradient(ellipse,#fff,#dfeafa);border:1px solid #bed4ed;border-radius:24px;position:relative;overflow:hidden}.hero-plane-model{position:absolute;inset:0;width:100%;height:100%}.hero-plane-model canvas{width:100%;height:100%;display:block}#stats{font:12px monospace;color:#5c7092}@media(max-width:600px){main{padding:16px}.stage{height:340px}}
</style><main><h1>VIP 飞机 · 真实 WebGL 模型验收</h1><p>这页渲染实际模型；不创建账号、会员或对局。对应设计图为建模参考，细节差异以实际画面为准。</p><nav id="styles"><button data-style="gold">金翼机长 · 双翼机</button><button data-style="sapphire">云端漫游 · 双发水上飞机</button><button data-style="night">星夜竞速 · 双尾运动机</button></nav><div class="stage"></div><nav><button id="front">正面</button><button id="side">侧面</button><button id="three">三分之四视角</button><button id="motion">播放 / 停止螺旋桨</button></nav><p id="stats"></p></main><script type="module">
import {HeroPlane} from './hero-plane.js';let hero,style='gold',moving=true;
function show(next){style=next;hero?.dispose();hero=new HeroPlane(document.querySelector('.stage'),{model:true,style,reduced:!moving});document.querySelectorAll('[data-style]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.style===style)));let triangles=0;hero.model?.traverse(n=>{if(n.isMesh)triangles+=(n.geometry.index?.count||n.geometry.attributes.position.count)/3*(n.isInstancedMesh?n.count:1)});document.getElementById('stats').textContent=`${style} · ${hero.wrap.dataset.heroRenderer} · ${triangles.toLocaleString()} triangles · ${hero.model?.userData.propellers.length||0} propellers`;}
document.querySelector('#styles').onclick=e=>{if(e.target.dataset.style)show(e.target.dataset.style)};
for(const [id,angle] of [['front',-.63],['side',.94],['three',0]])document.getElementById(id).onclick=()=>{hero.model.rotation.y=angle;hero.render(performance.now())};document.getElementById('motion').onclick=()=>{moving=!moving;hero.setReduced(!moving)};show('gold');
</script></html>
