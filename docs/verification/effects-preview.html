<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/dist/"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="visual-v7.css"><style>body{padding:20px}h1{font-size:24px}#preview-board{position:relative;width:min(700px,100%);height:500px;margin:auto;background:#d9efff;overflow:hidden}.preview-controls{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:15px}.preview-controls button{padding:12px;border-radius:12px;background:white;border:1px solid #b7d6f6}#celebration{margin:15px auto;max-width:500px;text-align:center}</style><h1>飞行特效 · 本地验收预览（模拟会员）</h1><p>仅渲染验收，不产生对局、会员或成绩。移动按游戏原速展示。</p><div class="preview-controls"><button data-trail="star">星光尾迹</button><button data-trail="rainbow">彩虹尾迹</button><button data-trail="cloud">云朵尾迹</button><button id="reduced-test">减少动态效果</button><button id="victory-test">金翼庆典预览</button></div><output id="effect-count">等待预览</output><div id="preview-board"></div><div id="celebration"><div class="trophy"></div><h2>大卫，完美降落！</h2><button class="primary">再来一局 ↗</button></div><script type="module">
import {CanvasBoard} from './fallback.js';import {Game} from './engine.js';import {renderVictory} from './victory-effects.js';
const host=document.getElementById('preview-board'),b=new CanvasBoard(host,()=>{});let game,busy=false;
function setup(style){game=new Game([0,1,2,3].map((n)=>({name:'Pilot '+n,type:n?'bot':'human'})));game.players[0].pieces=[0,-1];game.players[0].member=true;game.players[0].flightTrail=style;b.setGame(game);}
setup('star');const emit=b.cosmeticTrails.emit.bind(b.cosmeticTrails);b.cosmeticTrails.emit=(...args)=>{emit(...args);document.getElementById('effect-count').textContent='样式 '+args[0]+' · 尾迹采样 '+b.cosmeticTrails.points.length;};document.querySelectorAll('[data-trail]').forEach(button=>button.onclick=async()=>{if(busy)return;busy=true;setup(button.dataset.trail);await b.move({color:0,piece:0,from:0,to:8,captured:[]});busy=false;});document.getElementById('reduced-test').onclick=()=>{b.reduced=!b.reduced;document.body.classList.toggle('reduce-motion',b.reduced)};document.getElementById('victory-test').onclick=()=>renderVictory(document.getElementById('celebration'),{member:true,victoryEffect:'gold',color:0},{reduced:b.reduced,label:'金翼庆典'});
</script></html>
