<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/dist/"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="visual-v2.css"><link rel="stylesheet" href="visual-v3.css"><link rel="stylesheet" href="visual-v4.css"><link rel="stylesheet" href="visual-v5.css"><link rel="stylesheet" href="visual-v6.css"><link rel="stylesheet" href="visual-v7.css"><style>body{padding:30px}#rankings{max-width:600px;margin:auto}.controls{margin:20px;text-align:center}.controls button{padding:12px;border-radius:10px;background:white}.test-label{font-size:13px;text-align:center}</style><p class="test-label">结算卡片本地验收 · 模拟数据</p><div class="controls"><button id="confirm">模拟服务端确认</button></div><div id="rankings"></div><p class="test-label" id="status">等待服务器确认</p><script type="module">
import {renderResultRankings} from './result-rankings.js';
const players=[{name:'金翼飞行员',member:true,avatarFrame:'gold'},{name:'大卫',member:true,avatarFrame:'cloud'},{name:'星夜飞行员',member:true,avatarFrame:'night'},{name:'Pilot 4',member:false}],ranking=[0,1,2,3],root=document.getElementById('rankings'),t=(en,zh)=>zh;
renderResultRankings(root,players,ranking,{key:'preview',online:true,t});const before=[...root.children],avatars=before.map(r=>r.querySelector('.result-avatar'));
document.getElementById('confirm').onclick=()=>{renderResultRankings(root,players,ranking,{key:'preview',online:true,t,confirmed:ranking.map((seatIndex,i)=>({seatIndex,pointsDelta:[2,1,0,-1][i]}))});document.getElementById('status').textContent='确认后保留相同卡片和头像节点：'+before.every((r,i)=>root.children[i]===r&&r.querySelector('.result-avatar')===avatars[i]);};
</script></html>
